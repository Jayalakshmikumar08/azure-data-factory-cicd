parameters:
  - name: azureResourceManagerConnection
    type: string
  - name: dataFactory
    type: string
  - name: resourceGroup
    type: string
  - name: subscriptionId
    type: string
  - name: environmentName
    type: string
  - name: location
    type: string
  - name: storageAccount
    type: string

steps:
  - task: AzureCLI@2
    displayName: Verify provisioned infrastructure
    inputs:
      azureSubscription: ${{ parameters.azureResourceManagerConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        az account set --subscription "${{ parameters.subscriptionId }}"

        az resource show \
          --resource-group "${{ parameters.resourceGroup }}" \
          --resource-type Microsoft.DataFactory/factories \
          --name "${{ parameters.dataFactory }}" \
          --output none

        az resource show \
          --resource-group "${{ parameters.resourceGroup }}" \
          --resource-type Microsoft.Storage/storageAccounts \
          --name "${{ parameters.storageAccount }}" \
          --output none

  - task: DownloadPipelineArtifact@2
    displayName: Download ARM template artifact
    inputs:
      buildType: current
      artifactName: ArmTemplate
      targetPath: $(Pipeline.Workspace)/ArmTemplate

  - task: AzurePowerShell@5
    displayName: Stop active ADF triggers
    inputs:
      azureSubscription: ${{ parameters.azureResourceManagerConnection }}
      pwsh: true
      azurePowerShellVersion: LatestVersion
      ScriptType: FilePath
      ScriptPath: $(Pipeline.Workspace)/ArmTemplate/PrePostDeploymentScript.ps1
      scriptArguments: >
        -ArmTemplate "$(Pipeline.Workspace)/ArmTemplate/ARMTemplateForFactory.json"
        -ArmTemplateParameters "$(Build.Repository.LocalPath)/devops/parameters/${{ parameters.environmentName }}.json"
        -ResourceGroupName "${{ parameters.resourceGroup }}"
        -DataFactoryName "${{ parameters.dataFactory }}"
        -predeployment $true
        -deleteDeployment $false

  - task: AzureResourceManagerTemplateDeployment@3
    displayName: Deploy ADF ARM template
    inputs:
      deploymentScope: Resource Group
      azureResourceManagerConnection: ${{ parameters.azureResourceManagerConnection }}
      subscriptionId: ${{ parameters.subscriptionId }}
      action: Create Or Update Resource Group
      resourceGroupName: ${{ parameters.resourceGroup }}
      location: ${{ parameters.location }}
      templateLocation: Linked artifact
      csmFile: $(Pipeline.Workspace)/ArmTemplate/ARMTemplateForFactory.json
      csmParametersFile: $(Build.Repository.LocalPath)/devops/parameters/${{ parameters.environmentName }}.json
      overrideParameters: >
        -factoryName "${{ parameters.dataFactory }}"
        -ls_adls_url "https://${{ parameters.storageAccount }}.dfs.core.windows.net/"
      deploymentMode: Incremental

  - task: AzurePowerShell@5
    displayName: Restart ADF triggers
    inputs:
      azureSubscription: ${{ parameters.azureResourceManagerConnection }}
      pwsh: true
      azurePowerShellVersion: LatestVersion
      ScriptType: FilePath
      ScriptPath: $(Pipeline.Workspace)/ArmTemplate/PrePostDeploymentScript.ps1
      scriptArguments: >
        -ArmTemplate "$(Pipeline.Workspace)/ArmTemplate/ARMTemplateForFactory.json"
        -ArmTemplateParameters "$(Build.Repository.LocalPath)/devops/parameters/${{ parameters.environmentName }}.json"
        -ResourceGroupName "${{ parameters.resourceGroup }}"
        -DataFactoryName "${{ parameters.dataFactory }}"
        -predeployment $false
        -deleteDeployment $true
