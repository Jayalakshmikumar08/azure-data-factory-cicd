parameters:
  - name: azureResourceManagerConnection
    type: string
  - name: environmentName
    type: string
  - name: location
    type: string
  - name: resourceGroup
    type: string
  - name: subscriptionId
    type: string
  - name: dataFactory
    type: string
  - name: storageAccount
    type: string

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Validate ${{ upper(parameters.environmentName) }} infrastructure
    inputs:
      azureSubscription: ${{ parameters.azureResourceManagerConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        az account set --subscription "${{ parameters.subscriptionId }}"

        az deployment group validate \
          --name "validate-adf-platform-${{ parameters.environmentName }}-$(Build.BuildId)" \
          --resource-group "${{ parameters.resourceGroup }}" \
          --template-file "$(Build.Repository.LocalPath)/infra/main.bicep" \
          --parameters \
            environmentName="${{ parameters.environmentName }}" \
            location="${{ parameters.location }}" \
            dataFactoryName="${{ parameters.dataFactory }}" \
            storageAccountName="${{ parameters.storageAccount }}" \
          --only-show-errors \
          --output none

  - task: AzureCLI@2
    displayName: Provision ${{ upper(parameters.environmentName) }} infrastructure
    inputs:
      azureSubscription: ${{ parameters.azureResourceManagerConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        az account set --subscription "${{ parameters.subscriptionId }}"

        az deployment group create \
          --name "adf-platform-${{ parameters.environmentName }}-$(Build.BuildId)" \
          --resource-group "${{ parameters.resourceGroup }}" \
          --template-file "$(Build.Repository.LocalPath)/infra/main.bicep" \
          --parameters \
            environmentName="${{ parameters.environmentName }}" \
            location="${{ parameters.location }}" \
            dataFactoryName="${{ parameters.dataFactory }}" \
            storageAccountName="${{ parameters.storageAccount }}" \
          --mode Incremental \
          --only-show-errors \
          --output none
